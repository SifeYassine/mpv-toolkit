# smart_skip configuration
# Finds openings/endings by comparing episodes of the same show, shows them as
# "Opening"/"Ending" chapters and skips them.
#
# Keys: Alt+. skip (opening/ending, otherwise to the next silent gap)
#       Alt+, undo the last skip
# To change them, add lines like this to input.conf:
#   Alt+. script-binding smart_skip/skip
#   Alt+, script-binding smart_skip/undo

# skip openings/endings automatically (no = only show them as chapters)
auto_skip=yes

# opening / ending length limits (seconds)
intro_min=15
intro_max=180
outro_min=15
outro_max=240

# 0..1, how alike file names must be to count as the same show
min_name_similarity=0.5

# skip key: jump to the next gap quieter than gap_noise_db lasting
# gap_min_duration, ignoring gaps in the first gap_ignore seconds, at most
# gap_max_skip seconds ahead
gap_noise_db=-40
gap_min_duration=0.65
gap_ignore=5
gap_max_skip=180

# empty = ffmpeg.exe/ffprobe.exe next to mpv.exe, then PATH
ffmpeg_path=
ffprobe_path=
