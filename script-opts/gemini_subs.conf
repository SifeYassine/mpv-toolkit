# gemini_subs settings — copy to <mpv config>/script-opts/gemini_subs.conf
# Get a free key at https://aistudio.google.com/apikey
# (or leave empty and set the GEMINI_API_KEY environment variable)
api_key=

model=gemini-2.5-flash

# Language to translate into, in plain words (English, Vietnamese, ...).
# Leave empty to only transcribe in the original language.
target_lang=Arabic
# Optional hint for the spoken language; empty = auto-detect
source_lang=
# When translating, show the original line under the translation
show_original=no

# Audio is sent in chunks of this length, up to lookahead_seconds ahead of playback
chunk_seconds=30
lookahead_seconds=90
max_parallel=2

# 0 = no thinking (fastest). -1 = don't send this setting (use for models that reject it)
thinking_budget=0

ffmpeg_path=ffmpeg
curl_path=curl
font_size=40

# Save the subtitles as <video>.gemini.<lang>.srt next to the video
export_srt=yes
# Turn on automatically for every file (otherwise press ctrl+g)
auto_start=no

# Tried in order (comma-separated) when a model's daily free quota is used up
fallback_models=gemini-2.5-flash-lite

# Remember finished parts (in <mpv config>/cache/gemini_subs) so reopening a
# video never re-sends them
resume=yes

# Used for YouTube and other web URLs
ytdl_path=yt-dlp

# Extra seconds of audio sent on each side of a chunk, so sentences crossing a
# chunk boundary are heard in full (0 = off)
overlap_seconds=5
