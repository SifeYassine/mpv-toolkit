# gemini_subs settings — copy to <mpv config>/script-opts/gemini_subs.conf
# Get a free key at https://aistudio.google.com/apikey
# (or leave empty and set the GEMINI_API_KEY environment variable)
api_key=

model=gemini-2.5-flash

# Language to translate into, in plain words (English, Vietnamese, ...).
# Leave empty to only transcribe in the original language.
target_lang=Arabic
# Optional hint for the spoken language; empty = auto-detect
source_lang=

# 0 = no thinking (fastest). -1 = don't send this setting (use for models that reject it)
thinking_budget=0

curl_path=curl
